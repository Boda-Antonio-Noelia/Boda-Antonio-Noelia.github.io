<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de asistencia · Antonio & Noelia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="asistencia.css" />
</head>

<body>
  <main class="attendance-page">
    <section class="attendance-shell">

      <div class="attendance-topbar">
        <a href="index.html#asistencia" class="attendance-back">
          <span aria-hidden="true">←</span>
          Volver a la invitación
        </a>
      </div>

      <header class="attendance-heading">
        <p class="attendance-signature">Antonio & Noelia</p>
        <h1>Formulario de asistencia</h1>
      </header>

      <form class="attendance-form" id="attendanceForm">

        <div class="form-group">
          <label for="nombre">Nombre y apellidos</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            autocomplete="name"
            required
            placeholder="Por ejemplo: María García"
          />
        </div>

        <fieldset class="form-group attendance-choice">
          <legend>¿Podrás acompañarnos?</legend>

          <div class="choice-grid">
            <label class="choice-card">
              <input type="radio" name="asiste" value="si" required />
              <span class="choice-check" aria-hidden="true">✓</span>
              <strong>Sí, allí estaré</strong>
            </label>

            <label class="choice-card">
              <input type="radio" name="asiste" value="no" required />
              <span class="choice-check" aria-hidden="true">✓</span>
              <strong>No podré acompañaros</strong>
            </label>
          </div>
        </fieldset>

        <div id="attendanceYesFields" class="conditional-fields">

          <div class="form-group">
            <label for="alimentacion">¿Tienes alguna alergia o intolerancia?</label>
            <textarea
              id="alimentacion"
              name="alimentacion"
              rows="3"
              placeholder="Cuéntanos si debemos tener algo en cuenta"
            ></textarea>
          </div>

          <fieldset class="form-group attendance-choice">
            <legend>¿Vendrás acompañado?</legend>

            <div class="choice-grid compact-choice-grid">
              <label class="choice-card compact-choice">
                <input type="radio" name="acompanado" value="si" />
                <span class="choice-check" aria-hidden="true">✓</span>
                <strong>Sí</strong>
              </label>

              <label class="choice-card compact-choice">
                <input type="radio" name="acompanado" value="no" />
                <span class="choice-check" aria-hidden="true">✓</span>
                <strong>No</strong>
              </label>
            </div>
          </fieldset>

          <div id="companionFields" class="conditional-fields">
            <div class="form-group">
              <label for="acompanante">Nombre del acompañante</label>
              <input
                type="text"
                id="acompanante"
                name="acompanante"
                placeholder="Por ejemplo: Juan Pérez"
              />
            </div>

            <div class="form-group">
              <label for="alimentacionAcompanante">¿Tiene alguna alergia o intolerancia?</label>
              <textarea
                id="alimentacionAcompanante"
                name="alimentacionAcompanante"
                rows="3"
                placeholder="Cuéntanos si debemos tener algo en cuenta"
              ></textarea>
            </div>
          </div>

          <div class="form-group">
            <label for="observaciones">¿Algo más que debamos saber?</label>
            <textarea
              id="observaciones"
              name="observaciones"
              rows="3"
              placeholder="Cualquier detalle que quieras contarnos"
            ></textarea>
          </div>

        </div>

        <div class="form-group message-group">
          <label for="mensaje">¿Quieres dejarnos unas palabras?</label>
          <textarea
            id="mensaje"
            name="mensaje"
            rows="4"
            placeholder="Es opcional, pero nos encantará leerte ❤️"
          ></textarea>
        </div>

        <button type="submit" class="attendance-submit">
          Enviar respuesta
        </button>

        <p class="attendance-demo-note">
          De momento esta versión es de prueba: el envío todavía no está conectado.
        </p>
      </form>

      <div class="attendance-success" id="attendanceSuccess" hidden>
        <span class="success-icon">✓</span>
        <p class="attendance-kicker">Respuesta recibida</p>
        <h2>¡Gracias por contárnoslo!</h2>
        <p>Ya tenemos tu respuesta. ❤️</p>
        <a href="index.html" class="attendance-submit attendance-return">Volver a la invitación</a>
      </div>

    </section>
  </main>
  <script>
const attendanceForm = document.getElementById("attendanceForm");
const yesFields = document.getElementById("attendanceYesFields");
const companionFields = document.getElementById("companionFields");
const success = document.getElementById("attendanceSuccess");

function openPanel(panel) {
  panel.classList.add("is-open");
}

function closePanel(panel) {
  panel.classList.remove("is-open");
}

document
  .querySelectorAll('input[name="asiste"]')
  .forEach((input) => {
    input.addEventListener("change", () => {
      const attending = input.value === "si" && input.checked;

      if (attending) {
        openPanel(yesFields);
      } else {
        closePanel(yesFields);
        closePanel(companionFields);

        document
          .querySelectorAll('input[name="acompanado"]')
          .forEach((radio) => {
            radio.checked = false;
          });

        const companionInput = document.getElementById("acompanante");
        const companionFood = document.getElementById("alimentacionAcompanante");

        if (companionInput) companionInput.value = "";
        if (companionFood) companionFood.value = "";
      }
    });
  });

document
  .querySelectorAll('input[name="acompanado"]')
  .forEach((input) => {
    input.addEventListener("change", () => {
      const hasCompanion = input.value === "si" && input.checked;

      if (hasCompanion) {
        openPanel(companionFields);
      } else {
        closePanel(companionFields);

        const companionInput = document.getElementById("acompanante");
        const companionFood = document.getElementById("alimentacionAcompanante");

        if (companionInput) companionInput.value = "";
        if (companionFood) companionFood.value = "";
      }
    });
  });

attendanceForm.addEventListener("submit", (event) => {
  event.preventDefault();

  attendanceForm.hidden = true;
  success.hidden = false;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});
</script>
</body>
</html>
